<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="Ru">

<head th:replace="layouts/main :: htmlhead"/>

<body>

<div th:replace="layouts/main :: navigation" />

<div class="container">
    <div class="row">
        <div class="col text-center">
            <h1 class="mt-5">Restaurant Tables</h1>
            <p class="lead">Manage your restaurant tables</p>
        </div>
    </div>
</div>

<div class="container pl-0">
    <div class="row pb-3 pt-3 mb-2 pl-0 ml-0">
        <div class="col-12 pl-0">
            <a type="button" th:href="@{/tables/new}" class="btn btn-primary">Add New Table</a>
        </div>
    </div>
</div>

<div class="container" th:remove="${tables.size() == 0} ? all">
    <div class="row p-3 mb-2 bg-dark text-white">
        <div class="col">Table Number</div>
        <div class="col">Capacity</div>
        <div class="col">Type</div>
        <div class="col">Location</div>
        <div class="col">Status</div>
        <div class="col text-center">Actions</div>
    </div>

    <div th:each="table,rowStat : ${tables}"
         class="d-flex align-items-center row p-2 mb-2"
         th:classappend="${rowStat.count % 2 != 0 ? 'bg-light text-dark' : 'bg-secondary text-white'}">
        <div class="col font-weight-bold" th:text="${table.tableNumber}"/>
        <div class="col" th:text="${table.capacity}"/>
        <div class="col" th:text="${table.tableType}"/>
        <div class="col" th:text="${table.locationDescription}"/>
        <div class="col">
            <span th:if="${table.isAvailable}" class="badge badge-success">Available</span>
            <span th:unless="${table.isAvailable}" class="badge badge-danger">Not Available</span>
        </div>
        <div class="col text-center">
            <a type="button" th:href="@{/tables/{id}/edit(id=${table.id})}"
               class="btn btn-sm btn-outline-primary">Edit</a>
            <a type="button" th:href="@{/tables/{id}/delete(id=${table.id})}"
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Are you sure you want to delete this table?')">Delete</a>
        </div>
    </div>
</div>

<div class="container" th:remove="${tables.size() != 0} ? all">
    <div class="row p-3 mb-2 bg-light text-dark">
        <div class="col-12">No tables found. Please add some tables.</div>
    </div>
</div>

<div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 200px;">
    <div class="toast" style="position: fixed; top: 10rem; right: 10rem;" data-delay="3000">
        <div class="toast-header">
            <strong class="mr-auto">Restaurant Info</strong>
            <small>Just now</small>
            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="toast-body" th:text="${flashMessage}"></div>
    </div>
</div>

<div th:replace="layouts/main :: footer"></div>
</body>
</html>
